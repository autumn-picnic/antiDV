---
name: Trigger auto deployment for xiaoan-web

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: [main]
    paths:
      - '**'

  # Allow manual trigger
  workflow_dispatch:

env:
  WEB_APP: xiaoan-web-session

concurrency:
  group: xiaoan-web-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Check Clerk build configuration
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.XIAOANWEB_CLERK_PUBLISHABLE_KEY }}
        run: test -n "$CLERK_PUBLISHABLE_KEY"

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.XIAOANWEB_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.XIAOANWEB_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.XIAOANWEB_AZURE_SUBSCRIPTION_ID }}

      - name: Check frontend runtime configuration
        run: |
          az containerapp show -n "$WEB_APP" -g xiaoan-pilot-rg -o json |
            jq -e '
              .location as $location |
              .properties.configuration.ingress as $ingress |
              .properties.template.containers[0].env as $env |
              $location == "Japan East" and
              ([$env[] | select(.name == "CHATFLOW_DATABASE_URL" and
                .secretRef == "feedback-database-url")] | length) == 1 and
              ([$env[] | select(.name == "CLERK_SECRET_KEY" and
                .secretRef == "clerk-secret-key")] | length) == 1 and
              ([$env[] | select(.name == "BACKEND_API_URL" and
                (.value == "http://xiaoan-api-session" or .value == "http://xiaoan-api-session-rollback"))] | length) == 1 and
              ([$env[] | select(.name == "FRONTEND_ORIGIN" and
                (.value == ("https://" + $ingress.fqdn) or
                  .value == "https://xiaoan.app" and
                  ([$ingress.customDomains[]? | select(.name == "xiaoan.app")] | length) == 1))] | length) == 1
            ' >/dev/null

      - name: Login to Azure Container Registry
        run: az acr login --name xiaoanhd5dc8acr

      - name: Build and push image
        env:
          IMAGE: xiaoanhd5dc8acr.azurecr.io/xiaoan-web:${{ github.sha }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.XIAOANWEB_CLERK_PUBLISHABLE_KEY }}
        run: |
          docker build --file Dockerfile \
            --build-arg "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$CLERK_PUBLISHABLE_KEY" \
            --tag "$IMAGE" .
          docker push "$IMAGE"

      - name: Sync speech credential to Key Vault
        run: |
          az deployment group create --resource-group xiaoan-pilot-rg \
            --name xiaoan-web-speech-key --template-file .github/azure/speech-key.bicep --output none

      - name: Bind runtime secrets
        run: |
          identity=$(az containerapp show -n "$WEB_APP" -g xiaoan-pilot-rg --query 'keys(identity.userAssignedIdentities)[0]' -o tsv)
          test -n "$identity"
          az containerapp secret set -n "$WEB_APP" -g xiaoan-pilot-rg \
            --secrets "feedback-context-secret=keyvaultref:https://xiaoan-hd5dc8-kv.vault.azure.net/secrets/xiaoan-feedback-context-secret,identityref:$identity" \
              "azure-speech-key=keyvaultref:https://xiaoan-hd5dc8-kv.vault.azure.net/secrets/xiaoan-web-azure-speech-key,identityref:$identity" \
              "account-cleanup=keyvaultref:https://xiaoan-hd5dc8-kv.vault.azure.net/secrets/xiaoan-account-cleanup-secret,identityref:$identity" --output none

      - name: Update existing web container
        env:
          IMAGE: xiaoanhd5dc8acr.azurecr.io/xiaoan-web:${{ github.sha }}
        run: |
          az extension add --name containerapp --upgrade --yes
          az containerapp update \
            --name "$WEB_APP" \
            --resource-group xiaoan-pilot-rg \
            --container-name web \
            --image "$IMAGE" \
            --set-env-vars FEEDBACK_CONTEXT_SECRET=secretref:feedback-context-secret \
              XIAOAN_ACCOUNT_CLEANUP_SECRET=secretref:account-cleanup \
              AZURE_SPEECH_KEY=secretref:azure-speech-key AZURE_SPEECH_REGION=japaneast \
            --output none

      - name: Verify deployed revision
        run: |
          for attempt in {1..24}; do
            latest=$(az containerapp show --name "$WEB_APP" --resource-group xiaoan-pilot-rg --query properties.latestRevisionName -o tsv)
            ready=$(az containerapp show --name "$WEB_APP" --resource-group xiaoan-pilot-rg --query properties.latestReadyRevisionName -o tsv)
            image=$(az containerapp show --name "$WEB_APP" --resource-group xiaoan-pilot-rg --query 'properties.template.containers[0].image' -o tsv)
            containers=$(az containerapp show --name "$WEB_APP" --resource-group xiaoan-pilot-rg --query 'length(properties.template.containers)' -o tsv)
            feedback_secret=$(az containerapp show --name "$WEB_APP" --resource-group xiaoan-pilot-rg --query "properties.template.containers[0].env[?name=='FEEDBACK_CONTEXT_SECRET'].secretRef | [0]" -o tsv)
            if [[ "$feedback_secret" == "feedback-context-secret" && "$latest" == "$ready" && "$containers" == "1" && "$image" == "xiaoanhd5dc8acr.azurecr.io/xiaoan-web:${GITHUB_SHA}" ]]; then
              echo "Healthy revision: $latest"
              exit 0
            fi
            sleep 5
          done
          echo "New xiaoan-web revision did not become ready" >&2
          exit 1
