---
name: Speech acceptance
on:
  pull_request:
    paths:
      - 'app/**'
      - 'hooks/**'
      - 'utils/crisis-prompt.ts'
      - 'tests/**'
      - 'lib/feedback/speech-repository.ts'
      - 'tests/speech*.cjs'
      - 'tests/chat-stop.test.cjs'
      - 'utils/speech-audio.ts'
      - 'db/migrations/004_speech_recordings.sql'
      - '.github/workflows/speech-validation.yml'
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Focused regression and type checks
        run: |
          node --test tests/*.test.cjs
          pnpm check:chatflow
      - name: Production build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: >-
            ${{ secrets.XIAOANWEB_CLERK_PUBLISHABLE_KEY }}
        run: pnpm build
